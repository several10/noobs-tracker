<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOOBS RIDERS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Фирменный стиль NOOBS RIDERS: графит, оранжевое солнце, бронза, снег */
:root{
  --page:#efece6; --card:#ffffff; --text:#22262e; --hint:#7c818b;
  --line:rgba(34,38,46,.10); --soft:rgba(34,38,46,.06);
  --ink:#22262e; --acc:#d55a26; --acc2:#b8925f; --ok:#2f9a68; --snow:#f4f2ee;
  --grad:linear-gradient(135deg,#bf4c1c 0%,#dd6a2b 60%,#ec944a 100%);
  --bronze:linear-gradient(135deg,#8c6a3f 0%,#d9b580 50%,#9a7445 100%);
  --hfont:"Unbounded","Arial Black",sans-serif;
}
:root[data-theme=dark]{
  --page:#121419; --card:#1d2027; --text:#eef0f3; --hint:#8d929c;
  --line:rgba(255,255,255,.08); --soft:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--page);color:var(--text);font:15px/1.4 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1,h2,.brand,.ex-today b,.lscore b,.pod .sc,.stat b,.rank{font-family:var(--hfont);letter-spacing:-.01em}
.brand{font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #b8925f;flex:none;background:#f4f2ee}
.topbar{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.topbar .logo{width:34px;height:34px}
.topbar .brand{font-size:14px}
body{padding:12px 12px calc(88px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--acc)}
.hint{color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:18px 4px 10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.banner{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--hint);margin-bottom:12px;text-align:center}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:24px;padding:16px 18px 40px;margin-bottom:12px;box-shadow:0 12px 30px rgba(34,38,46,.28)}
.hero::before{content:"";position:absolute;right:-38px;top:-62px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 65%,#ec944a,#c9531f 70%);opacity:.95}
.hero .arcs{position:absolute;right:-62px;top:-86px;width:196px;height:196px;border-radius:50%;border:3px solid transparent;border-left-color:#b8925f;border-bottom-color:#b8925f;transform:rotate(15deg);opacity:.8}
.hero .mnt{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px}
.hero > .in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero-top .brand{font-size:15px;line-height:1.1}
.hero-top .tag{font-size:11px;color:#e6d3b5;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.hero-main{display:flex;gap:16px;align-items:center}
.hero h1,.hero .sub{text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero .ring-txt{font-weight:900;font-size:16px;font-family:var(--hfont)}
.hero h1{font-size:17px;line-height:1.2}
.hero .sub{color:#c9ccd3;font-size:13px;margin:4px 0 10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(184,146,95,.6);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.ring{position:relative;flex:none}
.ring .ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.ring .ring-txt small{font-size:10px;font-weight:600;opacity:.85;margin-top:3px}

/* dates */
.dates{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:0 12px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:1 0 44px;background:var(--card);border-radius:14px;padding:8px 0;text-align:center;font-size:12px;color:var(--hint);position:relative}
.date b{display:block;font-size:16px;color:var(--text)}
.date.on{background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}.date.on b{color:#fff}
.date.done::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.date.on.done::after{background:#fff}
.date:disabled{opacity:.35}
.date.today:not(.on) b{color:var(--acc)}

/* exercise card */
.ex-head{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ex-title{flex:1;min-width:0}
.ex-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-today{text-align:right;line-height:1.1}
.ex-today b{font-size:26px;font-weight:800}
.ex-today span{display:block;font-size:11px;color:var(--hint)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.bar.full i{background:var(--ok)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.q{flex:1;min-width:52px;background:var(--soft);border-radius:12px;padding:9px 0;font-weight:700}
.q:active{transform:scale(.95);background:var(--acc);color:#fff}
.custom{display:flex;gap:6px;margin-top:8px}
.custom input{flex:1}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.wide{width:100%;padding:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{width:22px;height:22px;border-radius:50%;color:var(--hint);font-size:15px;line-height:1}

/* board */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--ink);color:#fff}
:root[data-theme=dark] .seg button.on,:root[data-theme=dark] .date.on{background:#343946}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wk button{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:18px}
.wk button:disabled{opacity:.3}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:8px 0 4px}
.pod{flex:1;text-align:center;max-width:120px}
.pod .av{margin:0 auto 6px}
.pod .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:20px;font-weight:800}
.pod .base{border-radius:14px 14px 4px 4px;margin-top:8px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:22px}
.p1 .base{height:86px;background:var(--grad)}
.p2 .base{height:62px;background:linear-gradient(135deg,#8e96a3,#d3d8e0)}
.p3 .base{height:46px;background:var(--bronze)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex:none}
.p1 .av{width:58px;height:58px;font-size:19px;box-shadow:0 0 0 3px var(--acc2)}
.podium-card{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.podium-card .nm{color:#fff}.podium-card::before{content:"";position:absolute;left:50%;top:-80px;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:radial-gradient(circle,#dd6a2b55,transparent 70%)}
.podium-card .podium{position:relative}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.me{background:rgba(213,90,38,.08);margin:0 -16px;padding:10px 16px}
.rank{width:22px;text-align:center;font-weight:800;color:var(--hint)}
.lmid{flex:1;min-width:0}
.lmid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--soft)}
.dots i.on{background:var(--ok)}
.lscore{text-align:right}
.lscore b{font-size:22px;font-weight:800}
.lscore span{display:block;font-size:11px;color:var(--hint)}
.tot{display:flex;align-items:center;gap:10px;padding:8px 0}
.tot .bar{flex:1;margin:0}

/* progress */
.chart-box{position:relative;height:190px}
.exsel{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.exsel::-webkit-scrollbar{display:none}
.exsel button{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.exsel button.on{background:var(--ink);color:#fff}
:root[data-theme=dark] .exsel button.on{background:var(--acc)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft)}
.heat i.l1{background:rgba(213,90,38,.25)}.heat i.l2{background:rgba(213,90,38,.5)}.heat i.l3{background:rgba(213,90,38,.78)}.heat i.l4{background:#c9531f}
.heat i.fut{background:transparent}
.heat-wrap{display:flex;gap:6px}
.heat-wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9px;color:var(--hint)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:11px;color:var(--hint)}

/* exercises */
.erow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--soft);font-size:18px;font-weight:700}
.stepper input{width:64px;text-align:center;padding:6px 4px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--soft);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.add{background:var(--soft);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--acc)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.emojis button{aspect-ratio:1;border-radius:10px;background:var(--soft);font-size:20px}
.emojis button.on{background:var(--acc)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.badge{font-size:11px;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--hint);margin-left:4px;font-weight:500}
.empty{text-align:center;padding:24px 8px;color:var(--hint)}
.empty .big{font-size:40px;margin-bottom:6px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px 0;font-weight:600}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);border:1px solid #b8925f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{text-align:center;padding:80px 0;color:var(--hint)}
.spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}

/* компактная главная */
body.syncing .topbar .brand::after,body.syncing .hero-top .brand::after{content:' ●';color:#ec944a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.erow .sp b{display:block;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.hero{padding:12px 14px 30px;border-radius:20px}
.hero .hero-main{gap:12px}
.hero-top{margin-bottom:4px}
.hero-top .logo{width:30px;height:30px}
.hero .sub{margin:2px 0 6px;font-size:12px}
.hero .mnt{height:24px}
.dates{margin-bottom:10px}
.date{padding:6px 0;border-radius:12px}
.card.ex{padding:10px 12px;margin-bottom:8px;border-radius:16px}
.card.ex .ico{width:auto;height:auto;background:none;font-size:22px}
.card.ex .ex-head{gap:10px}
.card.ex .ex-title b{font-size:15px;line-height:1.2}
.card.ex .ex-title .hint{font-size:12px}
.card.ex .ex-today b{font-size:22px}
.card.ex .bar{height:5px;margin:7px 0}
.qrow{display:flex;gap:6px}
.qrow .q{flex:0 0 52px;padding:7px 0;min-width:0}
.qrow input{flex:1;min-width:0;padding:7px 10px;border-radius:10px}
.qrow .btn.ok{padding:7px 14px;border-radius:10px}
.card.ex .chips{margin-top:8px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div><div class="brand" style="font-family:var(--hfont)">NOOBS RIDERS</div>Загрузка…</div></div>
<nav><div class="in">
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Сегодня</button>
  <button data-act="tab" data-v="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Рейтинг</button>
  <button data-act="tab" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M11 20V5M17 20v-6M2 20h20"/></svg>Прогресс</button>
  <button data-act="tab" data-v="ex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Упражнения</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ====== НАСТРОЙКА: вставьте URL веб-приложения Apps Script ====== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwwpvie_fQux5PPOcYFcSdbby0ZQO0Fu8tbAtWtjm9YZFgwQ_mIUhCpPjG6xii8L6t8/exec',
  SEASON_START: '2026-10-01',   // с какой даты считать «сезон» (сумма с начала челленджа)
};

/* ====== ядро ====== */
const tg = window.Telegram && window.Telegram.WebApp;
const DEMO = !(tg && tg.initData);
const SCORE_GOAL = 0.7, SCORE_DAYS = 0.3;
const UNITS = ['повт','сек','мин','км','м'];
const QUICK = {'повт':[5,10,15,20,30],'сек':[30,60,90,120,180],'мин':[5,10,15,30],'км':[1,2,3,5],'м':[100,250,500,1000]};
const DEF_GOAL = {'повт':800,'сек':3600,'мин':600,'км':60,'м':12000};   // цели на месяц
const QUICK2 = {'повт':[5,10],'сек':[30,60],'мин':[5,10],'км':[1,2],'м':[100,500]};
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const dim = d => { const t = new Date(d+'T00:00:00Z'); return new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate(); };
const EMOJIS = ['💪','🦵','🦾','🏋️','🧗','🔥','🪑','⏱️','🦩','🙈','⛰️','🦸','🔁','🏃','🏂','⭐'];
/* Каталог по умолчанию — должен совпадать с DEFAULT_EXERCISES в Code.gs */
const EX_DEFAULTS = [['pullups','Подтягивания','повт','🧗'],['pushups','Отжимания','повт','💪'],['abs','Пресс','повт','🔥'],['squats','Приседания','повт','🦵'],
  ['wallsit','Стульчик','сек','🪑'],['plank','Планка','сек','⏱️'],['revpush','Обратные отжимания','повт','🔁'],['sltilt','Наклоны на одной ноге','повт','🦩'],

const addDays = (d,n) => { const t = new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const dow = d => (new Date(d+'T00:00:00Z').getUTCDay()+6)%7;
const week = (today,off) => { const s = addDays(today,-dow(today)+7*off); return {start:s,end:addDays(s,6),days:[...Array(7)].map((_,i)=>addDays(s,i))}; };
const fmtD = d => { const p = d.split('-'); return (+p[2])+'.'+p[1]; };

const initials = n => String(n).split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const hue = id => { let h = 0; for (const c of String(id)) h = (h*31+c.charCodeAt(0))%360; return h; };

function ring(pct,size,stroke,color,track,inner){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s"/>
  </svg><div class="ring-txt">${inner}</div></div>`;
}

/* ====== расчёт рейтинга (та же формула, что в Code.gs) ====== */
function streak(userId){
  const set = new Set(S.log.filter(l=>l.userId===userId && l.value>0).map(l=>l.date));
  let d = set.has(S.today) ? S.today : addDays(S.today,-1), n = 0;
  while (set.has(d)) { n++; d = addDays(d,-1); }
  return n;
}
function board(wk){
  const rows = [];
  for (const u of S.users){
    const plans = S.plans.filter(p=>p.userId===u.id && p.active && p.goal>0);
    const logs = S.log.filter(l=>l.userId===u.id && l.date>=wk.start && l.date<=wk.end && l.value>0);
    if (!plans.length && !logs.length) continue;
    const sums = {}; logs.forEach(l=>sums[l.exId]=(sums[l.exId]||0)+l.value);
    const wkNorm = g => g*7/dim(wk.start);   // недельная норма = месячная цель ÷ дней в месяце × 7
    const goalPct = plans.length ? plans.reduce((a,p)=>a+Math.min(1,(sums[p.exId]||0)/wkNorm(p.goal)),0)/plans.length*100 : 0;
    const dayset = new Set(logs.map(l=>l.date));
    rows.push({ user:u, goalPct:Math.round(goalPct), days:dayset.size, dayset, sums,
      score:Math.round(SCORE_GOAL*goalPct + SCORE_DAYS*dayset.size/7*100), streak:streak(u.id) });
  }
  const key = {score:'score', goal:'goalPct', days:'days'}[ui.sort] || 'score';
  rows.sort((a,b)=>b[key]-a[key] || b.score-a.score || b.days-a.days);
  return rows;
}

const FATAL = ['bad_value','bad_date','unknown_exercise','forbidden','bad_name','bad_auth','auth_expired','no_auth','no_bot_token','unknown_action'];
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const ERR_RU = { bad_value:'неверное число', bad_date:'неверная дата', bad_name:'название от 2 до 40 символов', forbidden:'нельзя удалить чужую запись',
  bad_auth:'откройте трекер через Telegram', auth_expired:'перезапустите трекер', network:'нет связи с сервером' };
const errText = e => ERR_RU[e && e.message] || 'сервер не ответил';

async function api(action, body={}){
  if (DEMO) return demoApi(action, body);
  let r;
  try {
    r = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action, initData: tg.initData}, body)) });
  } catch(e){ throw new Error('network'); }
  let j; try { j = await r.json(); } catch(e){ throw new Error('bad_response'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function apiRetry(action, body, tries=4){
  for (let i=0;;i++){
    try { return await api(action, typeof body==='function' ? body() : body); }
    catch(e){ if (i>=tries-1 || FATAL.includes(e.message)) throw e; await sleep(700*(i+1)); }
  }
}

/* Изменения отправляются строго по очереди, интерфейс обновляется сразу (оптимистично). */
let queue = Promise.resolve(), pending = 0, syncTimer = null;
const idMap = {};
function send(action, body){
  pending++; setSync();
  const p = queue.then(()=>apiRetry(action, body));
  queue = p.catch(()=>{});
  p.catch(()=>{}).finally(()=>{ pending--; setSync(); scheduleSync(2500); });
  return p;
}
function scheduleSync(ms){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    if (pending) return;
    try { const s = await apiRetry('bootstrap', {}, 2); if (!pending){ S = s; saveCache(); safeRender(); } } catch(e){}
  }, ms);
}
function safeRender(){
  const a = document.activeElement;
  if (a && a.tagName==='INPUT' && a.value) { setTimeout(safeRender, 1500); return; }
  render();
}
function setSync(){ document.body.classList.toggle('syncing', pending>0); }

let goalTimers = {};
function savePlan(exId, goal, active){
  const p = S.plans.find(p=>p.userId===S.me.id && p.exId===exId);
  if (p){ p.goal=goal; p.active=active; } else S.plans.push({userId:S.me.id, exId, goal, active});
  render(); saveCache();
  send('setPlan',{exId, goal, active}).catch(e=>toast('Цель не сохранилась: '+errText(e)));
}
function addLog(exId, value){
  if (!(value>0)) return toast('Введите число больше нуля');
  haptic();
  const tmp = 'tmp'+Date.now()+Math.random().toString(36).slice(2,6);
  S.log.push({id:tmp, date:ui.date, userId:S.me.id, exId, value});
  render(); saveCache();
  const el = document.getElementById('t-'+exId); if (el) el.classList.add('pop');
  send('log',{date:ui.date, exId, value})
    .then(r=>{ idMap[tmp] = r.id; const l = S.log.find(l=>l.id===tmp); if (l) l.id = r.id; saveCache(); })
    .catch(e=>{ S.log = S.log.filter(l=>l.id!==tmp); render(); saveCache(); toast('Не сохранилось: '+errText(e)); });
}
function delLog(id){
  const old = S.log.find(l=>l.id===id); if (!old) return;
  S.log = S.log.filter(l=>l.id!==id); render(); saveCache();
  send('deleteEntry', ()=>({entryId: idMap[id] || id}))
    .catch(e=>{ S.log.push(old); render(); saveCache(); toast('Не удалилось: '+errText(e)); });
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b || !S) return;
  const a = b.dataset.act, v = b.dataset.v, ex = b.dataset.ex;
  if (a==='tab'){ ui.tab=v; ui.weekOff=0; render(); scrollTo(0,0); }
  else if (a==='date'){ ui.date=v; render(); }
  else if (a==='exp'){ ui.open = ui.open===ex ? null : ex; render(); }
  else if (a==='add') addLog(ex, +v);
  else if (a==='addc'){ const inp = document.getElementById('in-'+ex); addLog(ex, parseFloat(String(inp.value).replace(',','.'))); }
  else if (a==='del') delLog(v);
  else if (a==='wk'){ ui.weekOff = Math.min(0, ui.weekOff + +v); render(); }
  else if (a==='sort'){ ui.sort=v; render(); }
  else if (a==='pex'){ ui.ex=v; render(); }
  else if (a==='toggle'){ const p = S.plans.find(p=>p.userId===S.me.id && p.exId===ex); savePlan(ex, p?p.goal:0, false); }
  else if (a==='activate'){ const x = exById(ex); const old = S.plans.find(p=>p.userId===S.me.id && p.exId===ex); savePlan(ex, old&&old.goal?old.goal:(DEF_GOAL[x.unit]||100), true); haptic('ok'); }
  else if (a==='gstep'){
    const inp = document.querySelector(`[data-goal="${CSS.escape(ex)}"]`); const unit = exById(ex).unit;
    const step = unit==='км'?5:unit==='мин'?30:unit==='сек'?300:unit==='м'?1000:50;
    inp.value = Math.max(0, (+inp.value||0) + step*(+v)); haptic();
    clearTimeout(goalTimers[ex]); goalTimers[ex] = setTimeout(()=>savePlan(ex, +inp.value, true), 700);
  }
  else if (a==='emoji'){ ui.newEmoji=v; document.querySelectorAll('.emojis button').forEach(x=>x.classList.toggle('on', x.dataset.v===v)); }
  else if (a==='create'){
    const name = $('#nx-name').value.trim(), unit = $('#nx-unit').value, goal = +$('#nx-goal').value || DEF_GOAL[unit];
    if (name.length<2) return toast('Введите название');
    haptic('ok'); b.disabled = true; toast('Добавляю…');
    send('addExercise',{name, unit, emoji:ui.newEmoji, goal}).then(r=>{
      if (!S.exercises.find(x=>x.id===r.exercise.id)) S.exercises.push(r.exercise);
      const p = S.plans.find(p=>p.userId===S.me.id && p.exId===r.exercise.id);
      if (p){ p.goal=r.goal; p.active=true; } else S.plans.push({userId:S.me.id, exId:r.exercise.id, goal:r.goal, active:true});
      saveCache(); render(); toast('Добавлено: '+name);
    }).catch(e=>{ b.disabled = false; toast('Не добавилось: '+errText(e)); });
  }
});

      if (u.id==='1' && d>='2026-10-01' && d<='2026-10-23'){ const j = +d.slice(8)-1; Object.keys(real).forEach(x=>push(d,'1',x,real[x][j])); continue; }
      if (R()>p[u.id]) continue;
      plans.filter(q=>q.userId===u.id).forEach(q=>{ if (R()<.85){ let v = q.goal/30*(0.5+R()); v = q.goal>=100 ? Math.round(v/5)*5 : Math.round(v*10)/10; push(d,u.id,q.exId,v); } });
    }
  }
  return {today, me:users[0], users, exercises:ex, plans, log};
}
function demoApi(action, b){
  if (!DB) DB = demoData();
  const me = DB.me.id;
  const out = x => new Promise(r=>setTimeout(()=>r(JSON.parse(JSON.stringify(x))), 120));
  if (action==='log'){ const id = 'd'+Date.now(); DB.log.push({id, date:b.date, userId:me, exId:b.exId, value:+b.value}); return out({id}); }
  if (action==='deleteEntry') DB.log = DB.log.filter(l=>l.id!==b.entryId);
  if (action==='setPlan'){ const p = DB.plans.find(p=>p.userId===me && p.exId===b.exId); if (p){ p.goal=b.goal; p.active=b.active; } else DB.plans.push({userId:me, exId:b.exId, goal:b.goal, active:b.active}); }
  if (action==='addExercise'){ let e = DB.exercises.find(e=>e.name.toLowerCase()===b.name.toLowerCase());
    if (!e){ e = {id:'c'+Date.now().toString(36), name:b.name, unit:b.unit, emoji:b.emoji, createdBy:me}; DB.exercises.push(e); }
    const p = DB.plans.find(p=>p.userId===me && p.exId===e.id); if (p){ p.goal=b.goal; p.active=true; } else DB.plans.push({userId:me, exId:e.id, goal:b.goal, active:true});
    return out({exercise:e, goal:b.goal}); }
  if (action!=='bootstrap') return out({ok:true});
  return out(DB);
}
